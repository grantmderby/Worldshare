plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // NeoGradle replaces ForgeGradle. NeoGradle 7+ targets NeoForge.
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    // Shadow plugin for shading Google Drive deps. Keep using this; works fine with NeoGradle.
    // (We previously considered JarJar; for our use case Shadow is simpler since we only
    // ship one jar and the Google libs need package relocation to avoid conflicts.)
    id 'io.github.goooler.shadow' version '8.1.8'
}



configurations {
    shade
    implementation.extendsFrom shade
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 1.21.1 requires Java 21 (Minecraft moved up from 17 in 1.20.5).
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

runs {
    configureEach {
        workingDirectory project.file('run')
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main

        // 6 GB each. This started at 2 GB, on the reasoning that three clients
        // side by side is more memory than a 32 GB machine has left after
        // Windows, and that test worlds are small anyway.
        //
        // That held until the testing became exploration: generating terrain for
        // thousands of blocks is the one thing these clients do that a small
        // world does not bound. Two clients at 6 GB still fits; if a third is
        // needed at the same time, drop this back.
        jvmArgument '-Xmx6G'
        jvmArgument '-Xms512M'

        // Add Google libs explicitly to the run classpath
        dependencies {
            runtime 'com.google.api-client:google-api-client:2.2.0'
            runtime 'com.google.oauth-client:google-oauth-client:1.34.1'
            runtime 'com.google.oauth-client:google-oauth-client-java6:1.34.1'
            runtime 'com.google.apis:google-api-services-drive:v3-rev20230815-2.0.0'
        }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    // A second client, for testing the two-player flows on one machine.
    //
    // This works because everything that distinguishes two WorldShare users lives
    // under the game directory: the Google token store, the subscription list, and
    // machine_id - which is what SessionLock.isOwnedBy() compares. A separate
    // gameDir therefore reads as a genuinely different machine, so stale-lock
    // override and the per-player inventory behaviour can both be exercised here
    // rather than needing a second PC.
    //
    // The username matters too: offline UUIDs are derived from it, so without this
    // both clients would be the same player and playerdata/<uuid>.dat would collide.
    clientTwo {
        configure 'client'
        workingDirectory project.file('run2')
        programArguments.addAll '--username', 'Player2'
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    // A third client. Two is enough for the lock and round-trip tests, but not for
    // the ones that only go wrong with a crowd: a three-way contest for a single
    // lock, and whether a bucket repack preserves the playerdata of players who
    // aren't the one pushing. playerCap already defaults to 5.
    clientThree {
        configure 'client'
        workingDirectory project.file('run3')
        programArguments.addAll '--username', 'Player3'
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id

        // Creates 16-bucket worlds rather than the default 24.
        //
        // A world's bucket count is frozen when it is created, so the only way to
        // check that a current client opens a world made before the default moved
        // is to have a client that still makes them. Both dev clients load the
        // same classes, so this cannot be a constant.
        systemProperty 'worldshare.setupBucketCount', '16'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    data {
        workingDirectory project.file('run-data')
        programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // NeoForge maven (also pulls neoforge.userdev from here)
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.ow2.asm:asm:9.8'
        force 'org.ow2.asm:asm-analysis:9.8'
        force 'org.ow2.asm:asm-tree:9.8'
        force 'org.ow2.asm:asm-commons:9.8'
        force 'org.ow2.asm:asm-util:9.8'
    }
}

// ----- Unit tests -----
//
// These live in their own source set rather than in `test`, and that is deliberate.
// NeoGradle claims the `test` task and runs it under ModLauncher with the
// `forgejunitdev` launch target - it boots an actual Minecraft in "unit testing
// mode". That is the right machinery for tests that need the game, and entirely
// wrong for these: bucket assignment, archive packing and manifest diffing are
// plain Java, and asking for a Minecraft runtime to test them only bought us
// "Failed to start Minecraft".
//
// A source set NeoGradle doesn't know about gets a plain JVM, which is all these
// need. Anything that genuinely requires a world belongs in docs/E2E_TEST_PLAN.md.
sourceSets {
    unitTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

tasks.register('unitTest', Test) {
    description = 'Runs the pure-logic unit tests (no Minecraft, no Drive).'
    group = 'verification'
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath = sourceSets.unitTest.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('check') { dependsOn 'unitTest' }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Unit tests cover the pure logic only - bucket assignment, archive round-trips,
    // manifest diffing. None of it touches Minecraft or Drive, which is precisely why
    // it can run on every build. Anything needing a world or a Google account lives in
    // docs/E2E_TEST_PLAN.md and is run by hand.
    //
    // These attach to the `unitTest` source set, NOT to `test`. See the sourceSets
    // block below for why.
    unitTestImplementation platform('org.junit:junit-bom:5.10.2')
    unitTestImplementation 'org.junit.jupiter:junit-jupiter'
    unitTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Shade for jar packing (relocates packages into the output jar)
    compileOnly files('run/mods/e4mc-neoforge-6.1.0.jar')
    shade 'com.google.api-client:google-api-client:2.2.0'
    shade 'com.google.oauth-client:google-oauth-client:1.34.1'
    shade 'com.google.oauth-client:google-oauth-client-java6:1.34.1'
    shade 'com.google.apis:google-api-services-drive:v3-rev20230815-2.0.0'
}

// Populate neoforge.mods.toml placeholders at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ----- Jar + ShadowJar wiring -----
// Same pattern as before: shadowJar is the deliverable, plain jar is intermediate.
// NeoGradle does NOT have the "reobf" task that ForgeGradle did - NeoForge uses
// official mappings end-to-end, so what you build is what runs. No reobfuscation step!
// This is one of the cleanest wins of migrating: Shadow's output is the deliverable directly.

jar {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]

    // Ship the attribution with the thing it attributes.
    //
    // The excludes below drop META-INF/LICENSE, NOTICE and DEPENDENCIES from the
    // bundled jars, because eight libraries all writing to the same three paths
    // produces one arbitrary survivor rather than a usable record. Apache-2.0
    // still requires that recipients get the licence, that retained NOTICE text
    // travels with the code, and that relocation is declared as a modification -
    // so THIRD-PARTY-NOTICES.txt does all three in one curated file.
    from(rootProject.file('THIRD-PARTY-NOTICES.txt')) {
        into 'META-INF'
    }

    relocate 'com.google.api', 'com.worldshare.shaded.com.google.api'
    relocate 'com.google.auth', 'com.worldshare.shaded.com.google.auth'

    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'com/google/errorprone/**'
    exclude 'org/checkerframework/**'
    exclude 'javax/annotation/**'
    exclude 'com/google/j2objc/**'
    exclude 'com/google/errorprone/**'
    exclude 'javax/annotation/**'
    exclude 'javax/inject/**'
    exclude 'aopalliance/**'
    exclude 'org/apache/commons/**'
    relocate 'com.google.gson', 'com.worldshare.repack.gson'
    relocate 'org.apache.http', 'com.worldshare.repack.apache.http'
    relocate 'com.google.common', 'com.worldshare.repack.guava'
    relocate 'com.google.thirdparty', 'com.worldshare.repack.google.thirdparty'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// `./gradlew build` should produce the shaded jar as the primary artifact.
tasks.named('assemble') {
    dependsOn 'shadowJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact shadowJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}


