# NeoForge mod metadata. Replaces the old META-INF/mods.toml from Forge.
modLoader="javafml"
loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
credits="Built with NeoForge MDK"

# ----- Dependencies -----

# NeoForge itself - required
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

# Minecraft - required, version range scoped to 1.21.1
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# e4mc - optional, needed only for live co-op.
#
# The mod ID on the NeoForge build is "e4mc" (it was "e4mc_minecraft" on Forge).
#
# This is deliberately NOT required. Everything WorldShare is fundamentally for -
# Drive sync, session locking, push and pull - works without e4mc; it is only the
# "both online at once" case that needs a relay. Marking it required would refuse
# to launch the game for someone who just wants to pass a world back and forth,
# which is a poor first impression and excludes a legitimate way to use the mod.
#
# E4mcCoordinator.isAvailable() gates every path that depends on it, so a missing
# e4mc produces a clear message rather than a silent wait for a relay domain that
# will never arrive.
[[dependencies.${mod_id}]]
    modId="e4mc"
    type="optional"
    versionRange="[6.0,)"
    ordering="AFTER"
    side="CLIENT"
